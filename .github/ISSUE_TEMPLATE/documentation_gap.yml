name: Documentation gap
description: Report drift, ambiguity or missing guidance in README, runbooks or architecture docs.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: document
    attributes:
      label: Document or path
      placeholder: docs/verification/playback-verification.md
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong or unclear
      description: Point to the real contradiction, outdated text or missing explanation.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested correction
